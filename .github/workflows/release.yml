name: FlightGear ARM64 Build & Release
on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  VCPKG_TRIPLET: arm64-windows
  VCPKG_BUILD_TYPE: release

jobs:
  deps:
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4
        with: { repository: Nehal-aditya/flightgear-arm64, ref: next, path: manifest }
      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: C:\vcpkg\installed
          key: vcpkg-${{ env.VCPKG_TRIPLET }}-${{ hashFiles('manifest/vcpkg.json') }}
      - name: Bootstrap & install
        shell: pwsh
        run: |
          C:\vcpkg\vcpkg.exe install --triplet $env:VCPKG_TRIPLET --x-manifest-root=manifest --x-install-root=C:\vcpkg\installed
      - uses: actions/upload-artifact@v4
        with: { name: vcpkg-installed, path: C:\vcpkg\installed }

  osg:
    needs: deps
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4
        with: { repository: Nehal-aditya/openscenegraph-arm64, ref: next, path: osg }
      - uses: actions/download-artifact@v4
        with: { name: vcpkg-installed, path: C:\vcpkg\installed }
      - shell: cmd
        run: |
          cmake -S osg -B osg-build -G "Visual Studio 17 2022" -A ARM64 ^
            -DCMAKE_TOOLCHAIN_FILE=C:\vcpkg\scripts\buildsystems\vcpkg.cmake ^
            -DVCPKG_TARGET_TRIPLET=${{ env.VCPKG_TRIPLET }} ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_INSTALL_PREFIX=C:\stage\osg
          cmake --build osg-build --config Release --target INSTALL
      - uses: actions/upload-artifact@v4
        with: { name: osg-install, path: C:\stage\osg }
      - name: Clean build tree
        if: always()
        shell: pwsh
        run: Remove-Item -Recurse -Force osg-build -ErrorAction SilentlyContinue

  simgear:
    needs: osg
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4
        with: { repository: Nehal-aditya/simgear-arm64, ref: next, path: simgear }
      - uses: actions/download-artifact@v4
        with: { name: vcpkg-installed, path: C:\vcpkg\installed }
      - uses: actions/download-artifact@v4
        with: { name: osg-install, path: C:\stage\osg }
      - shell: cmd
        run: |
          cmake -S simgear -B simgear-build -G "Visual Studio 17 2022" -A ARM64 ^
            -DCMAKE_TOOLCHAIN_FILE=C:\vcpkg\scripts\buildsystems\vcpkg.cmake ^
            -DVCPKG_TARGET_TRIPLET=${{ env.VCPKG_TRIPLET }} ^
            -DCMAKE_INSTALL_PREFIX=C:\stage\simgear ^
            "-DCMAKE_PREFIX_PATH=C:\stage\osg;C:\vcpkg\installed\arm64-windows" ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DENABLE_TESTS=OFF ^
            -DCMAKE_CXX_FLAGS="-DNASAL_LE /EHsc"
          cmake --build simgear-build --config Release --target INSTALL
      - uses: actions/upload-artifact@v4
        with: { name: simgear-install, path: C:\stage\simgear }
      - name: Clean build tree
        if: always()
        shell: pwsh
        run: Remove-Item -Recurse -Force simgear-build -ErrorAction SilentlyContinue

  flightgear:
    needs: simgear
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4
        with: { repository: Nehal-aditya/flightgear-arm64, ref: next, path: flightgear }
      - uses: actions/download-artifact@v4
        with: { name: vcpkg-installed, path: C:\vcpkg\installed }
      - uses: actions/download-artifact@v4
        with: { name: osg-install, path: C:\stage\osg }
      - uses: actions/download-artifact@v4
        with: { name: simgear-install, path: C:\stage\simgear }
      - shell: cmd
        run: |
          cmake -S flightgear -B flightgear-build -G "Visual Studio 17 2022" -A ARM64 ^
            -DCMAKE_TOOLCHAIN_FILE=C:\vcpkg\scripts\buildsystems\vcpkg.cmake ^
            -DVCPKG_TARGET_TRIPLET=${{ env.VCPKG_TRIPLET }} ^
            -DCMAKE_INSTALL_PREFIX=C:\stage\flightgear ^
            "-DCMAKE_PREFIX_PATH=C:\stage\osg;C:\stage\simgear;C:\vcpkg\installed\arm64-windows" ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DFG_BUILD_TYPE=Release ^
            -DCMAKE_CXX_FLAGS="-DWIN32 -D_WIN32 -DNASAL_LE /EHsc" ^
            -DCMAKE_C_FLAGS="-DWIN32 -D_WIN32" ^
            -DFINAL_MSVC_3RDPARTY_DIR="C:\vcpkg\installed\arm64-windows"
          cmake --build flightgear-build --config Release --target INSTALL

      - name: Assemble slim runtime package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path C:\package\bin -Force | Out-Null

          # Runtime bins from each stage (fgfs.exe, osg dlls, osgPlugins, simgear dlls if any)
          Copy-Item -Path C:\stage\flightgear\bin\* -Destination C:\package\bin -Recurse -Force
          Copy-Item -Path C:\stage\osg\bin\* -Destination C:\package\bin -Recurse -Force
          if (Test-Path C:\stage\simgear\bin) {
            Copy-Item -Path C:\stage\simgear\bin\* -Destination C:\package\bin -Recurse -Force
          }

          # vcpkg runtime DLLs (zlib, libpng, freetype, openal, curl, c-ares, etc.)
          Copy-Item -Path C:\vcpkg\installed\arm64-windows\bin\*.dll -Destination C:\package\bin -Force

      - uses: actions/upload-artifact@v4
        with: { name: flightgear-arm64-build, path: C:\package }
      - name: Clean build tree
        if: always()
        shell: pwsh
        run: Remove-Item -Recurse -Force flightgear-build -ErrorAction SilentlyContinue

  release:
    needs: flightgear
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { name: flightgear-arm64-build, path: dist }
      - name: Zip build
        run: cd dist && zip -r ../flightgear-arm64-${{ github.run_number }}.zip .
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: arm64-${{ github.run_number }}
          name: FlightGear ARM64 build ${{ github.run_number }}
          files: flightgear-arm64-${{ github.run_number }}.zip
          prerelease: true
          body: |
            Native ARM64 Windows build. Requires FGDATA separately:
            `git clone --depth 1 https://gitlab.com/flightgear/fgdata.git`
            Then run with `fgfs.exe --fg-root=path\to\fgdata`