spec:
  inputs:
    clear-ccache-cache:
      type: boolean
      default: false
      description: "Clear the 'ccache' cache before starting the builds"
---

variables:
  BUILD_DIR: "$CI_PROJECT_DIR/build"
  PREFIX_DIR: "$CI_PROJECT_DIR/dist"
  OSG_REF: release/2024-build
  BRANCH_REF: release/2024.1
  # cache:key is not allowed to contain '/' characters
  BRANCH_REF_SLUG: release-2024-1
  # create a root dir *above* the Simgear checkout, otherwise CMake
  # complains about INTERFACE_INCLUDE_DIRECTORIES being the source dir
  WIN_FG_DIR: $CI_BUILDS_DIR\flightgear

  MAC_IMAGE: macos-26-xcode-26

# do not run pipelines on forks
# build merge requests, tags and the protected branches
workflow:
  rules:
    - if: $CI_PROJECT_NAMESPACE != "flightgear"
      when: never
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_REF_PROTECTED == "true"

.ccache-variables:
  variables:
    CCACHE_DIR: ${CI_PROJECT_DIR}/ccache-cache
    # This allows one to obtain ccache stats for a single job.
    CCACHE_STATSLOG: ${CI_PROJECT_DIR}/ccache-stats.log

.ccache-pre_non-windows:
  before_script:
    # Optional clearing of the 'ccache' cache
    - |
      if $[[ inputs.clear-ccache-cache ]]; then
        echo "Clearing the 'ccache' cache"
        ccache --clear
      fi
    - rm -f $CCACHE_STATSLOG

.ccache-pre_windows:
  before_script:
    # Optional clearing of the 'ccache' cache
    - |
      if ('$[[ inputs.clear-ccache-cache ]]' -eq 'true') {
        echo 'Clearing the ''ccache'' cache'
        ccache --clear
      }
    - |
      if (Test-Path $CCACHE_STATSLOG) {
        Remove-Item -Path $CCACHE_STATSLOG
      }

.ccache-stats:
  after_script:
    # For the particular build recorded in ${CCACHE_STATSLOG}
    - ccache --show-log-stats
    # Shows how much of the configurable cache size is used
    - ccache --show-stats

linux-build:
  extends: .ccache-variables
  image: ${CI_REGISTRY}/flightgear/flightgear-ci-docker/flightgear:2024.1
  stage: build
  before_script:
    - !reference [.ccache-pre_non-windows, before_script]
  script:
    - >
      cmake -B $BUILD_DIR -S $CI_PROJECT_DIR -G Ninja --fresh
      -D CMAKE_BUILD_TYPE=RelWithDebInfo
      -D CMAKE_INSTALL_PREFIX=$PREFIX_DIR
      -D CMAKE_PREFIX_PATH="$CI_PROJECT_DIR/simgear-dist;$CI_PROJECT_DIR/osg-dist"
      -D ENABLE_CCACHE=ON

    - cmake --build $BUILD_DIR
    - cmake --build $BUILD_DIR --target fgfs_test_suite
    - cmake --build $BUILD_DIR --target install
  after_script:
    - !reference [.ccache-stats, after_script]
  artifacts:
    paths:
      - $PREFIX_DIR
      # This is needed for the 'test' job.
      - $BUILD_DIR/test_suite
  needs:
    - project: flightgear/simgear
      job: linux-build
      artifacts: true
      ref: $BRANCH_REF
    - project: flightgear/openscenegraph
      job: linux-build
      ref: $OSG_REF
      artifacts: true
  cache:
    key: linux-amd64-$BRANCH_REF_SLUG
    paths:
      - $CCACHE_DIR

windows-build:
  variables:
    CCACHE_DIR: ${CI_PROJECT_DIR}\ccache-cache
    CCACHE_STATSLOG: ${CI_PROJECT_DIR}\ccache-stats.log
  stage: build
  tags:
    - saas-windows-medium-amd64
  before_script:
    - C:\"Program Files (x86)\Microsoft Visual Studio"\2022\BuildTools\Common7\Tools\Launch-VsDevShell -SkipAutomaticLocation -Arch amd64
  # relocate our upstream deps outside the source dir, otherwise
  # CMake gets sad.
    - Move-Item -Path $CI_PROJECT_DIR\boost $WIN_FG_DIR\boost
    - Move-Item -Path $CI_PROJECT_DIR\msvc140 $WIN_FG_DIR\msvc140
    # Should ideally be done inside CMake but this works for now.
    # The addition of $CI_PROJECT_DIR is for ccache.exe.
    - $Env:PATH += ";$WIN_FG_DIR\msvc140\3rdparty.x64\bin;$CI_PROJECT_DIR"
    - !reference [.ccache-pre_windows, before_script]
  script:
    - cmake -B $env:BUILD_DIR -S $env:CI_PROJECT_DIR -G "Ninja Multi-Config"
      --fresh
      -D CMAKE_INSTALL_PREFIX=$env:PREFIX_DIR
      -D MSVC_3RDPARTY_ROOT=$WIN_FG_DIR
      -D OSG_FSTREAM_EXPORT_FIXED:BOOL=ON
      -D CMAKE_PREFIX_PATH="$env:CI_PROJECT_DIR\simgear-dist;$env:CI_PROJECT_DIR\osg-dist"
      -D ENABLE_CCACHE=ON

    - cmake --build $BUILD_DIR --config Release
    - cmake --build $BUILD_DIR --config Release --target install
  after_script:
    # This is needed for ccache.exe.
    - $Env:PATH += ";$CI_PROJECT_DIR"
    - !reference [.ccache-stats, after_script]
  needs:
    - project: flightgear/simgear
      job: windows-build
      ref: $BRANCH_REF
      artifacts: true
    - project: flightgear/openscenegraph
      job: windows_build
      ref: $OSG_REF
      artifacts: true
    - project: flightgear/windows-3rd-party
      job: windows_build_msvc140
      ref: master
      artifacts: true
  artifacts:
    paths:
      - dist
  cache:
    key: windows-amd64-$BRANCH_REF_SLUG
    paths:
      - $CCACHE_DIR

macos-build:
  stage: build
  extends: .ccache-variables
  tags:
    - saas-macos-medium-m1
  image: $MAC_IMAGE
  before_script:
    - export HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK=1
    - export HOMEBREW_NO_INSTALL_CLEANUP=1
    - brew install ninja cmake boost ccache
    - !reference [.ccache-pre_non-windows, before_script]
  script:
    # ensure we use our FreeType and not the one from Homebrew
    # ours is UB, HomeBrew's is not
    - export FREETYPE_DIR=$CI_PROJECT_DIR/dist
    - >
      cmake -B $BUILD_DIR -S $CI_PROJECT_DIR -G Ninja --fresh
      -D CMAKE_BUILD_TYPE=RelWithDebInfo
      -D CMAKE_INSTALL_PREFIX=$PREFIX_DIR
      -D CMAKE_OSX_ARCHITECTURES=arm64
      -D CMAKE_PREFIX_PATH="$CI_PROJECT_DIR/osg-dist;$CI_PROJECT_DIR/simgear-dist"
      -D ENABLE_CCACHE=ON

    - cmake --build $BUILD_DIR
    - cmake --build $BUILD_DIR --target install
  after_script:
    - !reference [.ccache-stats, after_script]
  needs:
    - project: flightgear/simgear
      job: macos-build
      ref: $BRANCH_REF
      artifacts: true
    - project: flightgear/openscenegraph
      job: macos-build
      ref: $OSG_REF
      artifacts: true
    - project: flightgear/macos-3rd-party
      job: macos-build
      ref: main
      artifacts: true
  artifacts:
    paths:
      - dist
  cache:
    key: macos-universal-$BRANCH_REF_SLUG
    paths:
      - $CCACHE_DIR

macos-x64-build:
  stage: build
  extends: .ccache-variables
  tags:
    - saas-macos-medium-m1
  image: $MAC_IMAGE
  before_script:
    - export HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK=1
    - export HOMEBREW_NO_INSTALL_CLEANUP=1
    - brew install ninja cmake boost ccache
    - !reference [.ccache-pre_non-windows, before_script]
  script:
    # ensure we use our FreeType and not the one from Homebrew
    # ours is UB, HomeBrew's is not
    - export FREETYPE_DIR=$CI_PROJECT_DIR/dist
    - >
      cmake -B $BUILD_DIR -S $CI_PROJECT_DIR -G Ninja --fresh
      -D CMAKE_BUILD_TYPE=RelWithDebInfo
      -D CMAKE_INSTALL_PREFIX=$PREFIX_DIR
      -D CMAKE_OSX_ARCHITECTURES=x86_64
      -D CMAKE_PREFIX_PATH="$CI_PROJECT_DIR/osg-dist;$CI_PROJECT_DIR/simgear-dist"
      -D ENABLE_CCACHE=ON

    - cmake --build $BUILD_DIR
    - cmake --build $BUILD_DIR --target install
  after_script:
    - !reference [.ccache-stats, after_script]
  needs:
    - project: flightgear/simgear
      job: macos-x64-build
      ref: $BRANCH_REF
      artifacts: true
    - project: flightgear/openscenegraph
      job: macos-build
      ref: $OSG_REF
      artifacts: true
    - project: flightgear/macos-3rd-party
      job: macos-build
      ref: main
      artifacts: true
  artifacts:
    paths:
      - dist
  cache:
    key: macos-x64-$BRANCH_REF_SLUG
    paths:
      - $CCACHE_DIR

# Run tests using the binaries from the 'linux-build' job.
test:
  image: ${CI_REGISTRY}/flightgear/flightgear-ci-docker/flightgear:2024.1
  stage: test
  script:
    - cd $BUILD_DIR
    - export LD_LIBRARY_PATH=$LD_LIBRARY_PATH:$CI_PROJECT_DIR/osg-dist/lib
    - ./test_suite/fgfs_test_suite --fg-root $CI_PROJECT_DIR/testFGData
  needs:
    - job: linux-build
      artifacts: true
    - project: flightgear/fgdata
      job: create-test-data
      ref: $BRANCH_REF
      artifacts: true
    - project: flightgear/openscenegraph
      job: linux-build
      ref: $OSG_REF
      artifacts: true
